name: Lint

on:
  push:
    branches: [bze]
  pull_request:
    branches: [bze]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (pre-commit on changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit==4.3.0

      - name: Run pre-commit on changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FROM="${{ github.event.pull_request.base.sha }}"
          else
            FROM="${{ github.event.before }}"
          fi
          # A new branch push has an all-zero "before"; lint the whole tree then.
          if echo "$FROM" | grep -Eq '^0+$'; then
            pre-commit run --all-files
          else
            pre-commit run --from-ref "$FROM" --to-ref "${{ github.sha }}"
          fi
