name: Unit tests

on:
  push:
    branches: [bze]
  pull_request:
    branches: [bze]

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (inside the built image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: docker/setup-buildx-action@v3.12.0

      # Same image the other workflows build; the shared cache scope makes this cheap
      # once any of them has run on the same Dockerfile and environment.yml.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: hummingbot-api:ci
          cache-from: type=gha,scope=hummingbot-api-image
          cache-to: type=gha,scope=hummingbot-api-image,mode=max

      # Tests marked `integration` need live services and are left to the smoke workflow.
      - name: Run test suite
        run: |
          # Some tests read repo-root files (.env.example, README.md), which the image
          # does not carry, so run from a read-only mount of the checkout with the
          # image's Python environment.
          docker run --rm \
            -v "$PWD:/src:ro" \
            -w /src \
            --entrypoint pytest \
            hummingbot-api:ci -m "not integration" -p no:cacheprovider
